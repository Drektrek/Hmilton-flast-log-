<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Link Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
    }

    #banner {
      background-color: #000000;
      color: red;
      font-size: 72px;
      text-align: center;
      padding: 30px 0;
      width: 100%;
      font-family: 'Brush Script MT', cursive;
      box-sizing: border-box;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      color: #000;
    }

    h2 {
      text-align: center;
      color: #2196F3;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin-bottom: 15px;
      padding: 10px;
      border-left: 5px solid #2196F3;
      background: #f9f9f9;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    a {
      text-decoration: none;
      color: #000;
      font-weight: bold;
      font-size: 18px;
      display: block;
    }

    a:hover {
      color: #2196F3;
    }
  </style>
</head>
<body>

  <div id="banner">McKarr's Slo-Pitch League</div>

  <div class="container">
    <h2>Events & Pick-Up</h2>
    <ul>
      <li><a href="Closing.html">Closing Tournament</a></li>
      <li><a href="menspickup.html">Mens Monday Pick-up</a></li>
      <li><a href="#" onclick="accessWorkBee()">Work-Bee Sign-Up</a></li>
      <li><a href="opening-tournament.html">Opening Tournament</a></li>
    </ul>
  </div>

  <script>
    function accessWorkBee() {
      const password = prompt("Enter the Work-Bee access password:");
      if (password === "admin123") {
        window.location.href = "workbeesignup.html";
      } else if (password !== null) {
        alert("Incorrect password. Access denied.");
      }
    }
  </script>

</body>
</html>
