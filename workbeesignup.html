<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Work-Bee Log</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
    }

    #banner {
      background-color: #000000;
      color: red;
      font-size: 72px;
      text-align: center;
      padding: 30px 0;
      width: 100%;
      font-family: 'Brush Script MT', cursive;
      box-sizing: border-box;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      color: #000;
    }

    h2 {
      text-align: center;
      color: #2196F3;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 16px;
      box-sizing: border-box;
    }

    ol {
      padding: 20px;
      border-radius: 8px;
      background: #f9f9f9;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    li {
      margin-bottom: 10px;
      border-left: 5px solid #2196F3;
      padding-left: 10px;
    }

    #resetButton {
      background-color: #f44336;
      color: white;
    }

    button[type="submit"] {
      background-color: #4CAF50;
      color: white;
    }

    #successMessage {
      color: green;
      font-size: 16px;
      text-align: center;
      margin-top: 15px;
      display: none;
    }

    #errorMessage {
      color: red;
      font-size: 16px;
      text-align: center;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <div id="banner">McKarr's Slo-Pitch League</div>

  <div class="container">
    <h2>Work-Bee Log</h2>
    <form id="signupForm">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="text" id="team" placeholder="Team Name" required />
      <button type="submit">Sign Up</button>
      <button type="button" id="resetButton" onclick="resetList()">Reset List</button>
    </form>

    <ol id="signupList"></ol>
    <div id="successMessage">Sign-up successful! Thank you for your participation.</div>
    <div id="errorMessage">Please fill in both fields (Name and Team).</div>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const signupList = document.getElementById('signupList');
    const successMessage = document.getElementById('successMessage');
    const errorMessage = document.getElementById('errorMessage');
    
    // Change the unique storage key to 'workbee'
    const pageKey = 'workbee'; // Unique key for this page

    let entries = [];

    window.onload = () => {
      entries = JSON.parse(localStorage.getItem(pageKey)) || [];
      entries.forEach(entry => addEntryToDOM(entry));
    };

    form.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const team = document.getElementById('team').value.trim();

      // Handle empty fields
      if (!name || !team) {
        errorMessage.style.display = "block";
        successMessage.style.display = "none";
        return;
      }

      // Clear any error message
      errorMessage.style.display = "none";

      const entry = { name, team };
      entries.push(entry);
      localStorage.setItem(pageKey, JSON.stringify(entries)); // Uses new pageKey
      addEntryToDOM(entry);
      form.reset();
      successMessage.style.display = "block"; // Show success message
      setTimeout(() => successMessage.style.display = "none", 3000); // Hide success message after 3 seconds
    });

    function addEntryToDOM(entry) {
      const li = document.createElement('li');
      li.textContent = `${entry.name} (Team: ${entry.team})`;
      signupList.appendChild(li);
    }

    function resetList() {
      const password = prompt("Enter admin password to reset:");
      if (password === "admin123") {
        if (confirm("Are you sure you want to clear all sign-ups?")) {
          localStorage.removeItem(pageKey); // Uses new pageKey
          signupList.innerHTML = '';
          entries = [];
          alert("Log cleared.");
        }
      } else {
        alert("Incorrect password. Access denied.");
      }
    }
  </script>

</body>
</html>
