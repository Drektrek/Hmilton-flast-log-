<html lang="en">

  <title>Opening Tournament Sign-up</title>

      padding: 0;

      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;

    }

      color: #2196F3;

    li {

    }

    #resetButton {

    button[type="submit"] {

  </style>
</head>
